<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/">Gestión de Citas</a>
    <div>
        {% if current_user.is_authenticated %}
            <span class="text-white me-2">{{ current_user.nombre }}</span>
            <a href="/logout" class="btn btn-sm btn-outline-light">Salir</a>
        {% else %}
            <a href="/login" class="btn btn-sm btn-outline-light">Login</a>
            <a href="/registro" class="btn btn-sm btn-light">Registro</a>
        {% endif %}
    </div>
</nav>
<div class="container mt-4">
    {% with messages = get_flashed_messages() %}
        {% for m in messages %}
            <div class="alert alert-info">{{ m }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
